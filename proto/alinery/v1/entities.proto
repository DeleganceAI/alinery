// proto/alinery/v1/entities.proto
syntax = "proto3";
package alinery.v1;

import "google/protobuf/struct.proto";

message SessionRef {
  string task_slug = 1;  // "" for taskless chat sessions, as the daemon's metaPath does today
  string id = 2;
}

// Each entity message gets its real fields in the session that first produces it (plan 2.1.4):
// session meta S2.3 (status and attention S2.5), execution S2.4, daemon status S2.5, job S2.6, task S3.5, the rest P4. Until then
// an entity is empty, except Task and Session, which carry the few fields S2.1's tests need to
// tell one row from another.
message Task {
  string slug = 1;
  string title = 2;
}
message Draft {}
// One task's execution state, as `getTaskExecution` returns it (`TaskExecutionState` and the playbook
// definition) in JSON form. S4.2 replaces the two Structs with typed fields when it moves the state
// into execution.json; until then the entity and the RPC read are built by the same function.
message Execution {
  string slug = 1;
  google.protobuf.Struct state = 2;
  google.protobuf.Struct definition = 3;
}
// Fields 3 and up are `SessionMeta` (alinery-core types.rs), named as in the meta.json the daemon and
// Rust both write, so the parser (S2.3) and Rust's serde output compare field by field. `ref` comes
// from the file's path; `status` is the live state, which S2.5 fills.
message SemanticCheckpoint {
  optional uint64 phase_completed_at = 1;
  optional string omp_session_id = 2;
  optional uint64 omp_turn_id = 3;
}
message NotificationSuppression {
  string notice = 1;  // waiting_for_input, waiting_for_approval or failure
  string occurrence = 2;
}
// The live state `sessionState` reports (main.ts): process, agent and playbook axes, as the `list` and
// `status` ops carry them. Not on disk; the daemon fills it while the session is live.
message SessionStatus {
  string process = 1;  // starting, alive or exited
  string agent = 2;    // idle, busy, waiting_for_input, waiting_for_approval, ...
  string agent_correlation_id = 3;
  string agent_reason = 4;
  string playbook = 5;
  string playbook_reason = 6;
  string adapter = 7;
  string message_adapter = 8;
}
// The Attention doc's `wait` (plan S2.5): what the agent is waiting on, a field of the session.
message SessionWait {
  string kind = 1;  // input or approval
  string correlation_id = 2;
  optional string prompt = 3;
}
message Session {
  SessionRef ref = 1;
  SessionStatus status = 2;  // unset for a session with no live runner
  string id = 3;
  string worktree = 4;
  uint64 created = 5;
  bool archived = 6;
  bool pinned = 7;
  string phase = 8;
  string harness = 9;
  string model = 10;
  string playbook = 11;
  string execution_id = 12;
  uint64 execution_revision = 13;
  bool generic = 14;
  bool subtask_manager = 15;
  string subtask_slug = 16;
  string artifact = 17;
  string handoff_artifact = 18;
  string prompt_extra = 19;
  optional string prompt = 20;  // set (even to "") is the exact fresh-spawn prompt; unset derives it
  optional uint64 started_at = 21;
  optional uint64 status_changed_at = 22;
  optional uint64 activity_at = 23;
  uint64 status_revision = 24;
  optional uint64 ended_at = 25;
  optional int32 exit_code = 26;
  string harness_resume_token = 27;
  optional string resume_of = 28;
  string daemon_namespace = 29;
  optional uint64 notification_read_at = 30;
  optional uint64 exit_notification_read_at = 31;
  optional NotificationSuppression notification_suppression = 32;
  SemanticCheckpoint semantic = 33;
  string telemetry_id = 34;
  SessionWait wait = 35;  // unset when the agent waits for nothing
}
message Artifact {}
message Comment {}
message ChatThread {}
message Job {}
message Settings {}
// The daemon's half of the shell's `DaemonStatus`; `reachable`, `build_drift`, `conflict` and the lanes
// are the shell's, because only it can see them.
message DaemonStatus {
  uint32 protocol = 1;
  string build_id = 2;
  uint32 live_sessions = 3;  // sessions whose process is not exited
  string host_guard_warning = 4;  // "" until S4.1 adds the host-tool check
  bool watch_exhausted = 5;  // inotify ran out of watches (ENOSPC); the 30 s reconcile keeps the store right
}
message Playbook {}
message Attachment {}

message Entity {
  string key = 1;       // "<kind>/<task slug or _>/<id>", e.g. "session/fix-login/7f3a"
  uint64 revision = 2;  // seq of this entity's last change; the expected_revision for writes
  oneof value {
    Task task = 10;
    Draft draft = 11;
    Execution execution = 12;
    Session session = 13;
    Artifact artifact = 14;
    Comment comment = 15;
    ChatThread chat_thread = 16;
    Job job = 17;
    Settings settings = 18;
    DaemonStatus daemon_status = 19;
    Playbook playbook = 20;
    Attachment attachment = 21;
  }
}
