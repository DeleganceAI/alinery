// proto/alinery/v1/share.proto
syntax = "proto3";
package alinery.v1;

import "alinery/v1/common.proto";

// Sharing one daemon with one team. The shell mints the sync credential and delivers it here.
// The daemon pushes to the accounts service. It never opens a Supabase socket.
service ShareService {
  rpc SetShare(SetShareRequest) returns (SetShareResponse);      // ACT
  rpc ClearShare(ClearShareRequest) returns (ClearShareResponse);  // ACT
  // Fetch teammates' new comments now instead of waiting for the next heartbeat. Idempotent: the cursor moves on.
  rpc PullComments(PullCommentsRequest) returns (PullCommentsResponse);  // ACT
}

message SetShareRequest {
  MutationMeta meta = 1;
  string team_id = 2;
  string name = 3;
  string token = 4;
  string accounts_url = 5;
}
message SetShareResponse {}

message ClearShareRequest {
  MutationMeta meta = 1;
}
message ClearShareResponse {}

message PullCommentsRequest {}
message PullCommentsResponse {
  bool shared = 1;  // false when this daemon is not shared with a team, so there was nothing to fetch
  int32 saved = 2;  // comments written to this daemon's artifacts
}
