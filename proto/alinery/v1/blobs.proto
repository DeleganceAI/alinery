// proto/alinery/v1/blobs.proto
syntax = "proto3";
package alinery.v1;

import "alinery/v1/common.proto";

// Blobs never take a path from the client. A `BlobRef` names the thing and the daemon resolves and checks the path,
// so a client cannot read or write outside `.alinery/`. S4.3 builds the upload half and the reads of attachments and
// draft images; S4.5 adds artifact bodies, tree nodes and the files a step kept.
service BlobService {
  rpc ReadBlob(ReadBlobRequest) returns (stream ReadBlobResponse);   // VIEW
  rpc BeginUpload(BeginUploadRequest) returns (BeginUploadResponse);  // ACT
  rpc UploadChunk(UploadChunkRequest) returns (UploadChunkResponse);  // ACT
  rpc CommitUpload(CommitUploadRequest) returns (CommitUploadResponse);  // ACT
}

message AttachmentBlob {
  string task_slug = 1;  // a task, a draft, or "" for a taskless chat thread
  string name = 2;       // a file name in artifacts/attachments/
}
// A file that is uploaded before the thing that owns it exists (a task being created). `CommitUpload` leaves it in
// the daemon's staging directory and the ref it returns names it; CreateTask then moves it into place.
message StagedBlob {
  string name = 1;       // the name the file will keep
  string upload_id = 2;  // empty in a request; set in the CommitUpload response
}
// A pasted image kept in a draft's `draft-attachments.json`.
message DraftImageBlob {
  string draft_slug = 1;
  string name = 2;
}

// A file in a chat thread's `<id>.attachments` directory.
message ChatAttachmentBlob {
  string thread_id = 1;
  string name = 2;
}

// The body of one panel of a chat thread's canvas (read only).
message CanvasPanelBlob {
  string thread_id = 1;
  string panel = 2;  // p1 to p4
}

// A file a `file` or `files` canvas panel shows: the panel's own file (path ignored), or one row of its list (path
// relative to the listed directory). Nothing else is reachable, and the file must still be inside the repository.
message CanvasFileBlob {
  string thread_id = 1;
  string panel = 2;
  string path = 3;
}

// A presentation drawn to PDF by LibreOffice on the repository's machine, for its preview: the source is a canvas
// file, a worktree file or an artifact, checked as reading it would be. FAILED_PRECONDITION when LibreOffice is
// missing or the conversion fails, with a message to show.
message RenderedPdfBlob {
  BlobRef source = 1;
}

// A file in the task's `artifacts/` (not `attachments/` or `subtasks/`). The daemon refuses a link on the way.
message ArtifactBlob {
  string task_slug = 1;
  string name = 2;  // relative to artifacts/, forward slashes
}
// A file node of the task's artifact tree: its own, its parent's or active child's, a sub-task snapshot's, or an attachment of
// any of them. The node is named by the id the tree row carries.
message ArtifactNodeBlob {
  string task_slug = 1;  // the task whose tree holds the node
  string node_id = 2;
}
// A file an execution kept when it started or finished (O27): `tasks/<slug>/executions/<execution_id>/objects/<sha256>`, read-only.
// The manifest in the execution's engine state names the hashes. Gone when the task is archived (NOT_FOUND).
message StepObjectBlob {
  string task_slug = 1;
  string execution_id = 2;
  string sha256 = 3;  // 64 lowercase hex digits
}

// A file in the task's worktree (or the repository itself for a task without one), read only. `path` is relative to that
// root with forward slashes; the daemon refuses `..`, `.git`, absolute paths and any link on the way.
message WorktreeFileBlob {
  string task_slug = 1;
  string path = 2;
}

message BlobRef {
  oneof target {
    AttachmentBlob attachment = 2;
    ChatAttachmentBlob chat_attachment = 3;
    StagedBlob staged = 5;
    DraftImageBlob draft_image = 6;
    ArtifactBlob artifact = 7;
    ArtifactNodeBlob artifact_node = 8;
    StepObjectBlob step_object = 9;
    CanvasPanelBlob canvas_panel = 10;
    WorktreeFileBlob worktree_file = 11;
    CanvasFileBlob canvas_file = 12;
    RenderedPdfBlob rendered_pdf = 13;
  }
}

message ReadBlobRequest {
  BlobRef ref = 1;
  uint64 offset = 2;
  uint64 length = 3;  // 0: to the end
}
message ReadBlobResponse {
  bytes data = 1;
  uint64 offset = 2;  // position of the first byte of data
  uint64 total = 3;   // the blob's size
  string content_type = 4;
}

message BeginUploadRequest {
  MutationMeta meta = 1;
  BlobRef target = 2;
  uint64 size = 3;
  string sha256 = 4;  // lowercase hex, checked at commit
}
message BeginUploadResponse {
  string upload_id = 1;
  uint32 chunk_size = 2;
}
message UploadChunkRequest {
  string upload_id = 1;
  uint64 offset = 2;  // chunks arrive in order; an offset other than the bytes received so far is INVALID_ARGUMENT
  bytes data = 3;
}
message UploadChunkResponse {}
message CommitUploadRequest {
  string upload_id = 1;
}
message CommitUploadResponse {
  Applied applied = 1;
  BlobRef ref = 2;  // the final name (a name already taken gets a suffix) or the staged id
}
