// proto/alinery/v1/sessions.proto
syntax = "proto3";
package alinery.v1;

import "alinery/v1/entities.proto";
import "google/protobuf/struct.proto";

// Pi sessions have transcripts, not just bytes. S4.4 adds the unary calls (CreateSession, StartSession,
// RenameSession, ArchiveSession, KillSession, ResumeSession) to this service.
service SessionService {
  rpc WatchTranscript(WatchTranscriptRequest) returns (stream WatchTranscriptResponse);  // VIEW
}

// `from_item` is an index into the item list. 0 starts with everything.
message WatchTranscriptRequest {
  SessionRef session = 1;
  uint64 from_item = 2;
}

// A frame covers items [next_item - items.length, next_item). With replace unset those are new items
// appended to the client's list. With replace set the client drops everything from that index on and
// takes these items: a streaming message changed in place, or the list got shorter.
message WatchTranscriptResponse {
  repeated TranscriptItem items = 1;
  uint64 next_item = 2;
  bool replace = 3;
  SessionControls controls = 4;  // set on the first frame and whenever it changes
}

// The model and thinking level the next turn will use. No levels means no thinking menu.
message SessionControls {
  string model = 1;
  string thinking = 2;
  repeated string thinking_levels = 3;
}

// One message of the pane, as `formatTranscript` builds it (transcript.ts). Pi stores thinking, text and
// tool calls as parts on the assistant message, and a tool result as its own message.
message TranscriptItem {
  string id = 1;
  string role = 2;  // user, assistant or toolResult
  bool streaming = 3;
  repeated TranscriptPart content = 4;
  string tool_name = 5;
  string tool_call_id = 6;
  bool is_error = 7;
  repeated string running_tool_ids = 8;
}

message TranscriptPart {
  oneof kind {
    string text = 1;
    string thinking = 2;
    RedactedThinking redacted_thinking = 3;  // only the marker: the signature is for the provider, not the pane
    ToolCallPart tool_call = 4;
  }
}
message RedactedThinking {}
message ToolCallPart {
  optional string id = 1;
  optional string name = 2;
  google.protobuf.Value arguments = 3;  // unset when the call has none
}
