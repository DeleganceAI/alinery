<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Playbook v2 browser smoke</title></head>
<body><div id="root"></div>
<script>
const bridge = new URLSearchParams(location.search).get('bridge') || 'http://127.0.0.1:31627';
let callbackId = 0;
window.__TAURI_INTERNALS__ = {
  metadata: {currentWindow: {label: 'main'}, currentWebview: {label: 'main'}},
  transformCallback: () => ++callbackId,
  unregisterCallback: () => {},
  convertFileSrc: (path) => path,
  invoke: async (command, args = {}) => {
    if (command.startsWith('plugin:')) return command.endsWith('|listen') ? ++callbackId : null;
    const response = await fetch(bridge + '/api', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({command, args})});
    const result = await response.json();
    if (!result.ok) throw result.error;
    return result.value;
  }
};
window.__TAURI_EVENT_PLUGIN_INTERNALS__ = {unregisterListener: () => {}};
window.SMOKE_BRIDGE = bridge;
</script>
<script type="module" src="/src/playbook-v2-smoke.tsx"></script></body></html>
