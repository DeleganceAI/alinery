[package]
name = "alinery-runner"
version = "0.15.1"
license = "Apache-2.0"
edition = "2021"

[[bin]]
name = "alinery-runner"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
alinery-core = { path = "../alinery-core" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
