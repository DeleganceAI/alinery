version = 1
default = "superdevelop"
playbook_order = ["superdevelop", "one-shot", "free-form", "review", "bug-hunting"]

[playbooks.superdevelop]
title = "SuperDevelop"
description = "Develop a change from the initial question through review preparation."
kind = "linear"
steps = ["research-questions", "research", "design", "structure", "tdd", "implementation", "pr"]
columns = ["research-design", "planning", "implementation", "review"]

[playbooks.superdevelop.column.research-design]
title = "Research & Design"
steps = ["", "research-questions", "research", "design"]
[playbooks.superdevelop.column.planning]
title = "Planning"
steps = ["structure", "tdd"]
[playbooks.superdevelop.column.implementation]
title = "Build"
steps = ["implementation"]
[playbooks.superdevelop.column.review]
title = "Review"
steps = ["pr"]

[playbooks.superdevelop.auto_advance.questions_to_research]
title = "Clarify → Investigate"
from = "research-questions"
to = "research"
default_enabled = true
[playbooks.superdevelop.auto_advance.research_to_design]
title = "Investigate → Decide"
from = "research"
to = "design"
default_enabled = true
[playbooks.superdevelop.auto_advance.structure_to_tdd]
title = "Plan → Define Tests"
from = "structure"
to = "tdd"
default_enabled = true
[playbooks.superdevelop.auto_advance.tdd_to_implementation]
title = "Define Tests → Build"
from = "tdd"
to = "implementation"
default_enabled = true
[playbooks.superdevelop.auto_advance.implementation_to_pr]
title = "Build → Prepare Review"
from = "implementation"
to = "pr"
default_enabled = true

[playbooks.one-shot]
title = "One-shot"
description = "Implement from the task description in one agent pass, then prepare a PR note."
kind = "linear"
steps = ["implementation", "pr"]
columns = ["research-design", "planning", "implementation", "review"]

[playbooks.one-shot.column.research-design]
title = "Research & Design"
steps = [""]
[playbooks.one-shot.column.planning]
title = "Planning"
steps = []
[playbooks.one-shot.column.implementation]
title = "Implementation"
steps = ["implementation"]
[playbooks.one-shot.column.review]
title = "Review"
steps = ["pr"]

[playbooks.free-form]
title = "Free-form"
description = "Ad-hoc task sessions without linear progress."
kind = "freeform"
steps = []
columns = ["research-design", "planning", "implementation", "review"]

[playbooks.free-form.column.research-design]
title = "Research & Design"
steps = [""]
[playbooks.free-form.column.planning]
title = "Planning"
steps = []
[playbooks.free-form.column.implementation]
title = "Implementation"
steps = []
[playbooks.free-form.column.review]
title = "Review"
steps = []

[playbooks.review]
title = "Review"
description = "Review a PR or branch by understanding context, running checks, finding issues, and writing review output."
kind = "linear"
steps = ["review-context", "review-checks", "review-findings", "review-response"]
columns = ["research-design", "planning", "implementation", "review"]

[playbooks.review.column.research-design]
title = "Research & Design"
steps = [""]
[playbooks.review.column.planning]
title = "Planning"
steps = []
[playbooks.review.column.implementation]
title = "Implementation"
steps = []
[playbooks.review.column.review]
title = "Review"
steps = ["review-context", "review-checks", "review-findings", "review-response"]

[playbooks.review.auto_advance.context_to_checks]
title = "Review Context → Review Checks"
from = "review-context"
to = "review-checks"
default_enabled = true
[playbooks.review.auto_advance.checks_to_findings]
title = "Review Checks → Review Findings"
from = "review-checks"
to = "review-findings"
default_enabled = true

[playbooks.bug-hunting]
title = "Bug Hunting"
description = "Find the root cause of a bug, enumerate solutions, design the fix, then implement it."
kind = "linear"
steps = ["rca", "solutions", "design", "implementation", "pr"]
columns = ["research-design", "planning", "implementation", "review"]

[playbooks.bug-hunting.column.research-design]
title = "Research & Design"
steps = ["", "rca", "solutions", "design"]
[playbooks.bug-hunting.column.planning]
title = "Planning"
steps = []
[playbooks.bug-hunting.column.implementation]
title = "Implementation"
steps = ["implementation"]
[playbooks.bug-hunting.column.review]
title = "Review"
steps = ["pr"]

[playbooks.bug-hunting.auto_advance.rca_to_solutions]
title = "RCA → Possible Solutions"
from = "rca"
to = "solutions"
default_enabled = true
[playbooks.bug-hunting.auto_advance.implementation_to_pr]
title = "Implementation → PR"
from = "implementation"
to = "pr"
default_enabled = true

