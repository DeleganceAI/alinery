syntax = "proto3";
package alinery.v1;

message SessionRef {
  string task_slug = 1;
  string id = 2;
}

// Spike stand-ins: two entity kinds with the field mix the real ones have.
message Task {
  string slug = 1;
  string title = 2;
  string current_step = 3;
  bool archived = 4;
  repeated string related = 5;
  int64 updated_at_ms = 6;
}

message Session {
  SessionRef ref = 1;
  string name = 2;
  string status = 3;
  string phase = 4;
  optional string wait_prompt = 5;
}

message Entity {
  string key = 1;
  uint64 revision = 2;
  oneof value {
    Task task = 10;
    Session session = 13;
  }
}
